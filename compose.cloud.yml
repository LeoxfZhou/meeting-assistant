services:
  api:
    image: meeting-assistant:cloud-c4aa706
    mem_limit: 900m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  postgres:
    mem_limit: 450m
    command: [postgres, -c, shared_buffers=64MB, -c, max_connections=30]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
