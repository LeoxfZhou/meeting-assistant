name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-ephemeral-password
          POSTGRES_DB: meeting_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d meeting_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://postgres:ci-ephemeral-password@127.0.0.1:5432/meeting_ci
      JWT_SECRET: ci-only-ephemeral-signing-value-not-a-production-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install uv==0.10.12
      - run: uv sync --frozen
      - uses: actions/cache@v4
        with:
          path: models/multilingual-e5-small
          key: e5-int8-761b726dd34fb83930e26aab4e9ac3899aa1fa78
      - run: uv run python -m scripts.download_embedding
      - run: uv run pytest -q
