<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>中文会议行动助手</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#16302d;background:#f3f6f4}body{max-width:1120px;margin:auto;padding:28px}h1{margin:0;font-size:28px}h2{font-size:20px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.subtitle{color:#61746b;font-size:14px}.card{background:white;border:1px solid #d9e3dc;border-radius:12px;padding:20px;margin:16px 0}input,textarea,select,button{font:inherit;padding:9px;border:1px solid #baccc1;border-radius:6px;box-sizing:border-box}input,textarea{max-width:100%}textarea{width:100%;min-height:100px}button{cursor:pointer;background:#17664e;color:white;border-color:#17664e;margin:4px}button.secondary{background:white;color:#17664e}button:disabled{opacity:.6;cursor:wait}label{display:block;margin:10px 0 5px;font-size:14px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row input{flex:1}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #e2e9e5;text-align:left;padding:10px;font-size:14px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;line-height:1.6}.note{font-size:13px;color:#63766a}#message{position:sticky;top:0;background:#e5f0e9;padding:10px;z-index:2;border-radius:6px;display:none}dialog{width:min(700px,85vw);border:1px solid #baccc1;border-radius:12px}nav button{margin-right:8px}.pill{font-size:12px;background:#e9f1ec;padding:4px 8px;border-radius:20px}.hidden{display:none!important}.table-wrap{overflow-x:auto}.candidate{border-top:1px solid #e3ebe6;padding:15px 0}
</style></head>
<body><header><div><h1>中文会议行动助手</h1><div class="subtitle">会议 → 候选 → 人工确认 → 任务 · 企业知识与历史会议检索</div></div><span class="pill">本地演示 · 无通知</span></header>
<div id="message" role="status"></div>
<section id="auth" class="card"><h2>登录 / 注册</h2><p class="note">单公司演示。登录令牌仅保存在当前页面内存，刷新后需重新登录。请勿录入真实敏感会议。</p>
<form id="auth-form"><div class="row"><input id="email" type="email" placeholder="邮箱" required autocomplete="username"><input id="password" type="password" placeholder="密码（注册至少10字符）" required autocomplete="current-password"><input id="display-name" placeholder="注册显示名称" maxlength="100"></div><button type="submit">登录</button><button type="button" id="register">注册</button></form></section>
<div id="workspace" class="hidden"><nav class="row"><strong id="identity"></strong><button id="refresh" class="secondary">刷新会议与任务</button><button id="logout" class="secondary">退出</button><button id="ingest" class="secondary hidden">导入虚构企业资料</button></nav>
<section class="card"><h2>新建会议</h2><form id="meeting-form"><label for="title">标题</label><input id="title" maxlength="200" required style="width:100%"><label for="content">会议正文</label><textarea id="content" placeholder="示例：小张周五完成接口测试。"></textarea><div class="row"><button type="submit">保存文本会议</button><input id="file" type="file" accept=".txt,.md"><button type="button" id="upload" class="secondary">上传 TXT / Markdown</button></div></form><p class="note">上传限 UTF-8、1 MiB。AI 抽取需要服务器配置云端模型；保存和人工任务操作不依赖真实模型调用。</p></section>
<section class="card"><h2>会议</h2><div id="meetings"></div><div id="candidates"></div></section>
<section class="card"><div class="row"><h2>任务表</h2><label><input id="my-only" type="checkbox"> 只看我的任务</label></div><div class="table-wrap"><table><thead><tr><th>负责人</th><th>任务</th><th>截止时间</th><th>状态</th><th>来源会议</th></tr></thead><tbody id="tasks"></tbody></table></div></section>
<section class="card"><h2>知识检索与问答</h2><form id="question-form"><div class="row"><input id="question" maxlength="380" required placeholder="P1 事件几分钟内响应？"><button type="submit">检索依据</button><button type="button" id="ask" class="secondary">基于依据问答</button></div></form><p class="note">检索使用本地 CPU 模型；问答额外需要云 LLM。历史会议须先建立索引，权限与会议访问一致。</p><div id="answer"></div><div id="sources"></div></section></div>
<dialog id="detail"><button id="close-dialog" class="secondary">关闭</button><pre id="detail-text"></pre></dialog>
<script>
'use strict';
let token=null;const $=id=>document.getElementById(id);
function node(tag,text){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;return e}
function message(text){$('message').textContent=text;$('message').style.display='block'}
async function api(path,method='GET',body){const headers={};if(token)headers.Authorization='Bearer '+token;if(body && !(body instanceof FormData))headers['Content-Type']='application/json';const r=await fetch(path,{method,headers,body:body instanceof FormData?body:body?JSON.stringify(body):undefined});const d=r.status===204?null:await r.json();if(!r.ok){if(r.status===401 && token){token=null;$('workspace').classList.add('hidden');$('auth').classList.remove('hidden')}throw new Error(typeof d.detail==='string'?d.detail:'输入无效，请检查字段')}return d}
async function safely(fn){try{await fn()}catch(e){message(e.message)}}
function button(text,fn){const b=node('button',text);b.type='button';b.className='secondary';b.onclick=()=>safely(async()=>{b.disabled=true;try{await fn()}finally{b.disabled=false}});return b}
function showDetail(text){$('detail-text').textContent=text;$('detail').showModal()}
$('close-dialog').onclick=()=>$('detail').close();
async function login(){const d=await api('/auth/login','POST',{email:$('email').value,password:$('password').value});token=d.access_token;$('password').value='';const me=await api('/auth/me');$('identity').textContent=me.display_name+(me.is_owner?' · Owner':'');$('ingest').classList.toggle('hidden',!me.is_owner);$('auth').classList.add('hidden');$('workspace').classList.remove('hidden');message('已登录');await refresh()}
$('auth-form').onsubmit=e=>{e.preventDefault();safely(login)};
$('register').onclick=()=>safely(async()=>{await api('/auth/register','POST',{email:$('email').value,password:$('password').value,display_name:$('display-name').value});await login()});
$('logout').onclick=()=>{token=null;$('workspace').classList.add('hidden');$('auth').classList.remove('hidden');$('meetings').replaceChildren();$('tasks').replaceChildren();$('candidates').replaceChildren();$('sources').replaceChildren();$('answer').replaceChildren();message('已退出')};
$('meeting-form').onsubmit=e=>{e.preventDefault();safely(async()=>{await api('/meetings','POST',{title:$('title').value,content:$('content').value});$('title').value='';$('content').value='';message('会议已保存');await refresh()})};
$('upload').onclick=()=>safely(async()=>{const file=$('file').files[0];if(!file)throw Error('请选择 TXT 或 Markdown 文件');const f=new FormData();f.append('file',file);if($('title').value)f.append('title',$('title').value);await api('/meetings/upload','POST',f);message('上传完成');await refresh()});
async function meetings(){const list=await api('/meetings?limit=100');$('meetings').replaceChildren();if(!list.length)$('meetings').append(node('p','还没有可访问的会议。'));for(const m of list){const row=node('div');row.className='row';row.append(node('strong',m.title),button('查看',()=>showDetail(m.content)),button('AI 提取',async()=>{const d=await api('/meetings/'+m.id+'/workflow','POST');message(d.status==='completed_no_actions'?'未提取到行动项':'候选已生成，等待人工审核');await candidates(m.id,m.title)}),button('审核候选',()=>candidates(m.id,m.title)),button('建立检索索引',async()=>{const r=await api('/meetings/'+m.id+'/index','POST');message('索引完成：'+r.chunks+' 个片段')}));$('meetings').append(row)}}
async function candidates(mid,title){const items=await api('/meetings/'+mid+'/candidates');const users=await api('/users');$('candidates').replaceChildren(node('h3',title+' · 人工审核'));if(!items.length)$('candidates').append(node('p','暂无候选，请先进行 AI 提取。'));for(const c of items){const box=node('div');box.className='candidate';box.append(node('span',c.status+' · 版本 '+c.revision));const task=node('input');task.value=c.task;task.style.width='100%';const owner=node('input');owner.value=c.assignee_name||'';owner.placeholder='会议人物姓名（可未注册）';const due=node('input');due.value=c.due_date_text||'';due.placeholder='截止时间原话';const bind=node('select');const empty=node('option','不绑定系统用户');empty.value='';bind.append(empty);for(const u of users){const o=node('option',u.display_name);o.value=u.id;bind.append(o)}bind.value=c.assignee_user_id||'';box.append(task,owner,due,bind,node('pre','原文证据：'+c.evidence));if(c.status==='pending'){box.append(button('保存编辑',async()=>{await api('/candidates/'+c.id,'PATCH',{revision:c.revision,task:task.value,assignee_name:owner.value||null,assignee_user_id:bind.value||null,due_date_text:due.value||null});await candidates(mid,title)}),button('确认并创建任务',async()=>{if(task.value!==c.task || owner.value!==(c.assignee_name||'') || due.value!==(c.due_date_text||'') || bind.value!==(c.assignee_user_id||''))throw Error('请先保存编辑，再确认');await api('/candidates/'+c.id+'/confirm','POST',{revision:c.revision});await candidates(mid,title);await tasks();message('已确认并创建正式任务')}),button('拒绝',async()=>{await api('/candidates/'+c.id+'/reject','POST',{revision:c.revision});await candidates(mid,title)}))}else{for(const input of [task,owner,due,bind])input.disabled=true}$('candidates').append(box)}}
async function tasks(){const list=await api($('my-only').checked?'/tasks/my':'/tasks?limit=100');$('tasks').replaceChildren();for(const t of list){const tr=node('tr');tr.append(node('td',t.assignee_name||'未指定'),node('td',t.title),node('td',t.due_date||t.due_date_text||'未设日期'));const state=node('td');const sel=node('select');for(const s of ['todo','in_progress','done']){const o=node('option',s);o.value=s;sel.append(o)}sel.value=t.status;sel.onchange=()=>safely(async()=>{await api('/tasks/'+t.id,'PATCH',{status:sel.value});message('状态已更新')});state.append(sel);tr.append(state);const source=node('td');source.append(button('查看来源',async()=>{const m=await api('/meetings/'+t.source_meeting_id);showDetail(m.title+'\n\n'+m.content)}));tr.append(source);$('tasks').append(tr)}}
async function refresh(){await meetings();await tasks()}
$('refresh').onclick=()=>safely(refresh);$('my-only').onchange=()=>safely(tasks);
$('ingest').onclick=()=>safely(async()=>{const r=await api('/knowledge/company/ingest','POST');message('已导入虚构企业资料：'+r.chunks+' 个片段')});
function sources(items){$('sources').replaceChildren();for(const s of items){const box=node('div');box.className='candidate';box.append(node('strong',s.source_title),node('pre',s.quote||s.content||''),button('核对原始片段',async()=>{const c=await api('/knowledge/chunks/'+s.chunk_id);showDetail(c.source_title+'\n\n'+c.content)}));$('sources').append(box)}}
$('question-form').onsubmit=e=>{e.preventDefault();safely(async()=>{const r=await api('/knowledge/search','POST',{question:$('question').value,k:5});$('answer').textContent='检索结果不是模型答案，请核对依据。';sources(r.sources)})};
$('ask').onclick=()=>safely(async()=>{const r=await api('/knowledge/ask','POST',{question:$('question').value,k:5});$('answer').textContent=(r.no_answer?'依据不足：':'')+r.answer;sources(r.sources)});
</script></body></html>
